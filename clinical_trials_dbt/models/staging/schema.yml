version: 2

models:
  - name: stg_ctgov_studies
    description: "Step 1: Staging view that cleanses strings using PARSE_JSON and filters out duplicate records."
    config:
      tags: ['clinical_trials', 'staging']
    columns:
      - name: NCT_ID
        description: "The unique National Clinical Trial alphanumeric identifier assigned by ClinicalTrials.gov."
        tests:
          - not_null 

  - name: int_study_interventions
    description: "Step 2: Intermediate transformation view executing a double lateral flatten to explode the interventions and phases arrays."
    config:
      tags: ['clinical_trials', 'intermediate']
    columns:
      - name: unique_intervention_key
        description: "Primary Key surrogate hash generated by hashing the NCT_ID, phase_index, and intervention_index."
        tests:
          - unique
          - not_null

  - name: fct_study_interventions
    description: "Step 3: Final physically materialized analytical table housing granular trial, phase, and intervention metrics."
    config:
      tags: ['clinical_trials', 'marts']
    columns:
      - name: unique_intervention_key
        description: "Primary Key surrogate hash mapping back to the logical intermediate transformation view."
        tests:
          - unique   # Critical test to ensure incremental inserts don't create duplicate rows
          - not_null
